# Board: Generic ESP32-C3 Board (Generic)
# Definition: definitions/boards/generic-esp32c3/manifest.yaml

esphome:
  name: weather
  friendly_name: weather

esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "DCmGW0bJUBKOuu6jeu/8ZoBiU/56MQJ0VhMZfqG2As4="

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: weather Fallback Hotspot
    password: "MEIzYN9W32Yx"

captive_portal:

i2c:
  - id: i2c_1
    scl: 7
    sda: 6

sensor:
  - platform: bme680
    id: sensor_bme680_1
    i2c_id: i2c_1
    humidity:
      name: Humidity
      id: sensor_bme680_1_humidity
    pressure:
      name: Pressure
      id: sensor_bme680_1_pressure
    temperature:
      name: Temperature
      id: sensor_bme680_1_temperature
    address: 0x77
    
  - platform: adc
    name: Battery Voltage
    id: battery_voltage_raw
    pin: GPIO0
    attenuation: 12db
    update_interval: 10s
    filters:
      - multiply: 2
    
  - platform: template
    name: "Battery Percentage"
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    lambda: |-
      float actual_voltage = id(battery_voltage_raw).state;
      
      // Map 3.2V (0%) to 4.2V (100%)
      float percentage = (actual_voltage - 3.2) / (4.2 - 3.2) * 100.0;
      
      // Keep boundaries strictly between 0% and 100%
      if (percentage > 100.0) return 100.0;
      if (percentage < 0.0) return 0.0;
      return percentage;