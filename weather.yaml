# Board: Generic ESP32-C3 Board (Generic)
# Definition: definitions/boards/generic-esp32c3/manifest.yaml

esphome:
  name: weather
  friendly_name: weather
  # Check the hardware key state immediately after sensors initialize
  on_boot:
    - priority: -100.0
      then:
        - if:
            condition:
              binary_sensor.is_on: defeat_sleep_pin
            then:
              - logger.log: "🔧 Key detected! Sleep prevented for maintenance/OTA."
              - deep_sleep.prevent: deep_sleep_config
            else:
              - logger.log: "🔋 Normal wake cycle. Waiting for transmission..."
              
              # Wait for connection to your native API (Home Assistant)
              - wait_until:
                  api.connected:
              # Wait a brief moment to ensure component queues are flushed/published
              - delay: 2s
              
              - logger.log: "✅ Data sent successfully. Going to sleep now."
              - deep_sleep.enter: deep_sleep_config
esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "DCmGW0bJUBKOuu6jeu/8ZoBiU/56MQJ0VhMZfqG2As4="

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: weather Fallback Hotspot
    password: "MEIzYN9W32Yx"
  enable_btm: true  # 802.11v BSS Transition Management
  enable_rrm: true  # 802.11k Radio Resource Management

captive_portal:

i2c:
  - id: i2c_1
    scl: 7
    sda: 6

sensor:
  - platform: bme680
    id: sensor_bme680_1
    i2c_id: i2c_1
    humidity:
      name: Humidity
      id: sensor_bme680_1_humidity
    pressure:
      name: Pressure
      id: sensor_bme680_1_pressure
    temperature:
      name: Temperature
      id: sensor_bme680_1_temperature
    address: 0x77
    update_interval: 60s
    
  - platform: adc
    name: Battery Voltage
    id: battery_voltage_raw
    pin: GPIO0
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2
    on_value:
      then:
        - component.update: battery_percentage


  - platform: template
    name: "Battery Percentage"
    id: battery_percentage
    device_class: battery
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: never 
    lambda: |-
      float actual_voltage = id(battery_voltage_raw).state;
      
      // Map 3.2V (0%) to 4.2V (100%)
      float percentage = (actual_voltage - 3.2) / (4.2 - 3.2) * 100.0;
      
      // Keep boundaries strictly between 0% and 100%
      if (percentage > 100.0) return 100.0;
      if (percentage < 0.0) return 0.0;
      return percentage;

deep_sleep:
  id: deep_sleep_config
  sleep_duration: 15min
  run_duration:
    default: 60s

# Define the physical pin/button you check on boot
binary_sensor:
  - platform: gpio
    id: defeat_sleep_pin
    name: "Defeat Sleep Key"
    pin:
      number: GPIO1
      mode: INPUT_PULLUP
      inverted: true