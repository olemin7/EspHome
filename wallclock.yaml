# Board: Generic ESP32-C3 Board (Generic)
# Definition: definitions/boards/generic-esp32c3/manifest.yaml

substitutions:
  #64:E8:33:88:11:DC
  #64:E8:33:87:D7:D0
  #64:E8:33:88:23:54
  # display_rotation: "180"
  # display_reverse: "true"
  #----------------------
  #64:E8:33:88:55:58
  display_rotation: "0"
  display_reverse: "true"
  
esphome:
  name: wallclock
  friendly_name: WallClock
  name_add_mac_suffix: true
  
  on_boot:
  - priority: -100
    then:
      lambda: |-
        id(display_max7219digit_1).update();
esp32:
  variant: esp32c3
  framework:
    type: esp-idf

logger:


api:
  encryption:
    key: "KDrseAa7DhsXLQjrymvYVTDSSm1liQZZ7gUGJ464Ff0="

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: WallClock Fallback Hotspot
    password: "MEIzYN9W32Yx"

  enable_btm: true  # 802.11v BSS Transition Management
  enable_rrm: true  # 802.11k Radio Resource Management
  use_address: 192.168.1.216 #64:E8:33:87:D7:D0
  #use_address: 192.168.1.166 #64:E8:33:87:D7:D0

captive_portal:

globals:
  - id: time_sync_done
    type: bool
    initial_value: "false"

i2c:
  - id: i2c_1
    scl: 9
    sda: 8

number:
  - platform: template
    name: "Day/Night Threshold"
    id: day_night_threshold_controller
    min_value: 1.0
    max_value: 3.0
    step: 0.1
    optimistic: true
    restore_value: true 
    initial_value: 2.0
    # Trigger whenever the float changes from Home Assistant
    on_value:
      then:
        - component.update: ambient_light_raw
          
sensor:
  - platform: adc
    name: ambient_light
    id: ambient_light_raw
    pin: GPIO0
    attenuation: 12db
    update_interval: 500ms
    on_value:
      then:
        - lambda: |-
            ESP_LOGI("adc","  %f", x);

  - platform: htu21d
    id: sensor_htu21d_1
    humidity:
      name: Humidity
      id: sensor_htu21d_1_humidity
    temperature:
      name: Temperature
      id: sensor_htu21d_1_temperature
    update_interval: 15min

binary_sensor:
  - platform: analog_threshold
    id: day_night
    sensor_id: ambient_light_raw
    internal: true

    threshold: !lambda |-
      return id(day_night_threshold_controller).state;
      
    on_press:
      then:
        - lambda: |-
            id(display_max7219digit_1).intensity(0);
            ESP_LOGI("day_night", "night");

    on_release:
      then:
        - lambda: |-
            id(display_max7219digit_1).intensity(5);
            ESP_LOGI("day_night", "day");
spi:
  - id: spi_1
    clk_pin: GPIO4
    mosi_pin: GPIO6

display:
  - platform: max7219digit
    id: display_max7219digit_1
    spi_id: spi_1
    cs_pin: GPIO5
    intensity: 0
    lambda: |-
      auto time_now = id(sntp_time).now();
      if (time_now.is_valid()) {
        it.printf(16, 0, id(font_clock), TextAlign::TOP_CENTER, "%d:%02d", time_now.hour, time_now.minute);
      }else{
        it.printf(31,0, id(font_default),TextAlign::RIGHT, "%s", get_mac_address_pretty().c_str());
      }
    num_chips: 4
    rotate_chip: ${display_rotation}
    scroll_enable: false
    reverse_enable: ${display_reverse}
    update_interval: never
    

font:
  - file: "fonts/font.bdf"
    id: font_clock
    size: 8
  - file: "fonts/pixelmix.ttf"
    id: font_default
    size: 8

time:  
  - platform: sntp
    id: sntp_time
    on_time_sync:
      then:
        lambda: |-
          id(display_max7219digit_1).update();
          
    update_interval: 12h
    on_time:
      - seconds: 0
        minutes: /1
        then:
          lambda: |-
            id(display_max7219digit_1).update();
 